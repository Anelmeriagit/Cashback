<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CashBack — мои кешбэки</title>
<meta name="description" content="Личный список кешбэков по банкам.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0d10">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%92%B8%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="wrap bar">
    <nav class="nav" aria-label="Разделы"><a class="logo on" id="navMain" href="#main" aria-current="page"><i></i><span>CashBack</span></a><a id="navRem" href="#reminders"><span>Напоминания</span></a></nav>
    <div class="tools">
      <span id="st" role="status" aria-live="polite"></span>
      <button class="icon-btn" id="editBtn" type="button" aria-pressed="false" aria-label="Режим редактирования" hidden>✎</button>
      <button class="icon-btn" id="outBtn" type="button" aria-label="Выйти" hidden>⎋</button>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Переключить тему">☾</button>
    </div>
  </div>
</header>
<div class="wrap"><div class="warn" id="warn" role="alert" hidden></div></div>
<div class="wrap" id="loginRoot"></div>
<main id="stage" hidden>
  <div class="prompt" id="prompt" inert><div class="pin"><div class="pbox"><span>Хотите заполнить категории на следующий месяц?</span><span><button class="btn" data-m="yes" type="button">Да</button><button class="btn" data-m="hide" type="button">Скрыть</button></span></div></div></div>
  <div class="months" id="months">
    <section class="mp" id="pCur"><div class="mi"><h2 class="mt" id="tCur"></h2><div id="bCur"></div></div></section>
    <section class="mp next" id="pNext" inert><div class="mi"><h2 class="mt" id="tNext"></h2><div class="lnks"><button class="lnk" data-m="close" type="button">скрыть</button></div><div id="bNext"></div></div></section>
  </div>
  <div id="foot"></div>
  <div class="histw"><button class="hlink" id="hBtn" data-h="toggle" type="button" aria-expanded="false" aria-controls="hist">История</button></div>
  <section class="hist" id="hist" inert><div class="hi"><div id="hBody"></div></div></section>
</main>
<main id="remStage" hidden>
  <div class="rwrap">
    <h2 class="mt">Напоминания</h2>
    <p class="rsub">Уведомления приходят в Telegram по московскому времени.</p>
    <div class="warn" id="remWarn" role="status" hidden></div>
    <div id="remBody"></div>
    <p class="rmsg" id="remMsg" role="status" aria-live="polite"></p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
